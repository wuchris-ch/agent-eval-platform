# Opt-in experimental namespace. Apply explicitly; existing schedules are unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-eval-experiments
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: experiments
  namespace: agent-eval-experiments
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 2Gi
    limits.cpu: '2'
    limits.memory: 4Gi
    pods: '2'
    count/jobs.batch: '2'
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: agent-eval-experiments
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
