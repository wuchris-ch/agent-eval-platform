<svg xmlns="http://www.w3.org/2000/svg" class="dg" data-diagram="metrics" viewBox="0 0 1432 452" width="1432" height="452" role="img" aria-labelledby="metrics-title metrics-desc">
<title id="metrics-title">Evidence and metrics</title>
<desc id="metrics-desc">Independent sources are preserved in results.json, the canonical run record. metrics.db is a query projection used by compare and report, verify-run recomputes and cross-checks the record, and optional OpenTelemetry export is content-minimized and lossy.</desc>
<defs><style>.dg text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}.dg .dg-bg{fill:#0d1016;}.dg .dg-box{fill:#141922;stroke:#2a3242;stroke-width:1.2;}.dg .dg-gate .dg-box,.dg .dg-decision .dg-box{fill:#e8ecf3;stroke:#e8ecf3;}.dg .dg-tag{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.08em;}.dg .dg-title{font-size:16px;font-weight:600;fill:#e8ebf1;letter-spacing:-.005em;}.dg .dg-mono-title{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:15.5px;}.dg .dg-detail{font-size:13.5px;fill:#98a1b1;}.dg .dg-mono{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:12.5px;fill:#b7c0cf;}.dg .dg-gate .dg-title,.dg .dg-decision .dg-title{fill:#0d1016;}.dg .dg-gate .dg-detail,.dg .dg-decision .dg-detail{fill:#465063;}.dg .dg-gate .dg-mono,.dg .dg-decision .dg-mono{fill:#2c3443;}.dg .dg-chip{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;}.dg .dg-line{fill:none;stroke:#5f6a7f;stroke-width:1.6;}.dg .dg-edge-retry .dg-line{stroke:#98a1b1;stroke-dasharray:5 5;}.dg .dg-edge-telemetry .dg-line{stroke:#b195f7;stroke-dasharray:5 5;}.dg .dg-edge-reject .dg-line{stroke:#f2646f;stroke-dasharray:5 5;}.dg .dg-edge-label{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;fill:#98a1b1;paint-order:stroke;stroke:#0d1016;stroke-width:5px;stroke-linejoin:round;}.dg .dg-frame rect{fill:#ffffff;fill-opacity:.018;stroke:#2f3848;stroke-width:1.2;stroke-dasharray:6 6;}.dg .dg-frame-label{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.1em;fill:#6b7486;}.dg .dg-note{font-size:13px;fill:#6b7486;}.dg .dg-code{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:12px;}.dg .dg-check{font-size:13.5px;fill:#2c3443;}.dg .dg-band-title{font-size:14.5px;font-weight:600;fill:#e8ebf1;}</style><marker id="metrics-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5f6a7f"/></marker><marker id="metrics-arrow-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#98a1b1"/></marker><marker id="metrics-arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#b195f7"/></marker><marker id="metrics-arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#f2646f"/></marker><marker id="metrics-arrow-lit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#7cb2ff"/></marker></defs>
<rect class="dg-bg" width="1432" height="452" rx="18"/>
<g class="dg-edge dg-edge-flow" data-from="sources" data-to="results"><path class="dg-line" d="M324 182 L396 182" marker-end="url(#metrics-arrow-flow)"/></g>
<g class="dg-edge dg-edge-flow" data-from="results" data-to="db"><path class="dg-line" d="M680 112 L752 112" marker-end="url(#metrics-arrow-flow)"/></g>
<g class="dg-edge dg-edge-flow" data-from="results" data-to="verifyrun"><path class="dg-line" d="M680 232 L752 232" marker-end="url(#metrics-arrow-flow)"/></g>
<g class="dg-edge dg-edge-telemetry" data-from="results" data-to="otel"><path class="dg-line" d="M680 360 L752 360" marker-end="url(#metrics-arrow-telemetry)"/></g>
<g class="dg-edge dg-edge-flow" data-from="db" data-to="report"><path class="dg-line" d="M1036 112 L1108 112" marker-end="url(#metrics-arrow-flow)"/></g>
<g class="dg-node dg-input" data-id="sources" tabindex="0"><rect class="dg-box" x="40" y="64" width="284" height="236" rx="10"/><text class="dg-tag" x="58" y="89" fill="#7cb2ff">RAW EVIDENCE</text><text class="dg-title" x="58" y="114">Independent sources</text><text class="dg-code" x="58" y="138" xml:space="preserve"><tspan fill="#7cb2ff">●  </tspan><tspan fill="#98a1b1">provider JSONL</tspan></text><text class="dg-code" x="58" y="162" xml:space="preserve"><tspan fill="#7cb2ff">●  </tspan><tspan fill="#98a1b1">process timing</tspan></text><text class="dg-code" x="58" y="186" xml:space="preserve"><tspan fill="#3fd294">●  </tspan><tspan fill="#98a1b1">JUnit + coverage</tspan></text><text class="dg-code" x="58" y="210" xml:space="preserve"><tspan fill="#f5a35c">●  </tspan><tspan fill="#98a1b1">diff + scanner results</tspan></text><text class="dg-code" x="58" y="234" xml:space="preserve"><tspan fill="#b195f7">●  </tspan><tspan fill="#98a1b1">judge results</tspan></text><text class="dg-code" x="58" y="258" xml:space="preserve"><tspan fill="#3fcbd3">●  </tspan><tspan fill="#98a1b1">governance + provenance</tspan></text></g>
<g class="dg-node dg-decision" data-id="results" tabindex="0"><rect class="dg-box" x="396" y="64" width="284" height="340" rx="10"/><text class="dg-tag" x="414" y="89" fill="#465063">CANONICAL RECORD</text><text class="dg-title dg-mono-title" x="414" y="114">results.json</text><text class="dg-detail" x="414" y="138">complete, bounded run record;</text><text class="dg-detail" x="414" y="156">explicit nulls for missing values</text><text class="dg-code" x="414" y="184" xml:space="preserve"><tspan fill="#465063">{</tspan></text><text class="dg-code" x="414" y="201" xml:space="preserve"><tspan fill="#2456c9">  &quot;task_id&quot;: </tspan><tspan fill="#0e7a4c">&quot;example-todo-api&quot;</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="218" xml:space="preserve"><tspan fill="#2456c9">  &quot;agent&quot;: </tspan><tspan fill="#0e7a4c">&quot;oracle&quot;</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="235" xml:space="preserve"><tspan fill="#2456c9">  &quot;correctness&quot;: </tspan><tspan fill="#465063">{…}</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="252" xml:space="preserve"><tspan fill="#2456c9">  &quot;scans&quot;: </tspan><tspan fill="#465063">{…}</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="269" xml:space="preserve"><tspan fill="#2456c9">  &quot;judge&quot;: </tspan><tspan fill="#465063">{…}</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="286" xml:space="preserve"><tspan fill="#2456c9">  &quot;assurance&quot;: </tspan><tspan fill="#b4441c">null</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="303" xml:space="preserve"><tspan fill="#2456c9">  &quot;outcome&quot;: </tspan><tspan fill="#465063">{…}</tspan><tspan fill="#465063">,</tspan></text><text class="dg-code" x="414" y="320" xml:space="preserve"><tspan fill="#2456c9">  &quot;provenance&quot;: </tspan><tspan fill="#465063">{…}</tspan><tspan fill="#465063"></tspan></text><text class="dg-code" x="414" y="337" xml:space="preserve"><tspan fill="#465063">}</tspan></text></g>
<g class="dg-node dg-output" data-id="db" tabindex="0"><rect class="dg-box" x="752" y="64" width="284" height="96" rx="10"/><text class="dg-tag" x="770" y="89" fill="#3fcbd3">QUERY PROJECTION</text><text class="dg-title dg-mono-title" x="770" y="114">metrics.db</text><text class="dg-detail" x="770" y="138">normalized across completed runs</text></g>
<g class="dg-node dg-step" data-id="verifyrun" tabindex="0"><rect class="dg-box" x="752" y="188" width="284" height="88" rx="10"/><text class="dg-tag" x="770" y="213" fill="#98a1b1">VERIFICATION</text><text class="dg-title dg-mono-title" x="770" y="238">verify-run</text><text class="dg-detail" x="770" y="262">recomputes and cross-checks</text></g>
<g class="dg-node dg-telemetry" data-id="otel" tabindex="0"><rect class="dg-box" x="752" y="316" width="284" height="88" rx="10"/><text class="dg-tag" x="770" y="341" fill="#b195f7">OPTIONAL EXPORT</text><text class="dg-title" x="770" y="366">OpenTelemetry</text><text class="dg-detail" x="770" y="390">content-minimized and lossy</text></g>
<g class="dg-node dg-output" data-id="report" tabindex="0"><rect class="dg-box" x="1108" y="64" width="284" height="96" rx="10"/><text class="dg-tag" x="1126" y="89" fill="#3fcbd3">CONSUMERS</text><text class="dg-title dg-mono-title" x="1126" y="114">compare + report</text><text class="dg-detail" x="1126" y="138">pass@k, trends, benchmark views</text></g>
</svg>
