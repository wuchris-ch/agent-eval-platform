<svg xmlns="http://www.w3.org/2000/svg" class="dg" data-diagram="governance" viewBox="0 0 1448 420" width="1448" height="420" role="img" aria-labelledby="governance-title governance-desc">
<title id="governance-title">Governed execution</title>
<desc id="governance-desc">A request is checked against policy and registries before any side effect. An admitted request gets a private task snapshot, then its execution identity is recomputed before the exact image and recipe run. A failed check at either gate stops the run and records the denial.</desc>
<defs><style>.dg text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}.dg .dg-bg{fill:#0d1016;}.dg .dg-box{fill:#141922;stroke:#2a3242;stroke-width:1.2;}.dg .dg-gate .dg-box,.dg .dg-decision .dg-box{fill:#e8ecf3;stroke:#e8ecf3;}.dg .dg-tag{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.08em;}.dg .dg-title{font-size:16px;font-weight:600;fill:#e8ebf1;letter-spacing:-.005em;}.dg .dg-mono-title{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:15.5px;}.dg .dg-detail{font-size:13.5px;fill:#98a1b1;}.dg .dg-mono{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:12.5px;fill:#b7c0cf;}.dg .dg-gate .dg-title,.dg .dg-decision .dg-title{fill:#0d1016;}.dg .dg-gate .dg-detail,.dg .dg-decision .dg-detail{fill:#465063;}.dg .dg-gate .dg-mono,.dg .dg-decision .dg-mono{fill:#2c3443;}.dg .dg-chip{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;}.dg .dg-line{fill:none;stroke:#5f6a7f;stroke-width:1.6;}.dg .dg-edge-retry .dg-line{stroke:#98a1b1;stroke-dasharray:5 5;}.dg .dg-edge-telemetry .dg-line{stroke:#b195f7;stroke-dasharray:5 5;}.dg .dg-edge-reject .dg-line{stroke:#f2646f;stroke-dasharray:5 5;}.dg .dg-edge-label{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;fill:#98a1b1;paint-order:stroke;stroke:#0d1016;stroke-width:5px;stroke-linejoin:round;}.dg .dg-frame rect{fill:#ffffff;fill-opacity:.018;stroke:#2f3848;stroke-width:1.2;stroke-dasharray:6 6;}.dg .dg-frame-label{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;font-weight:600;letter-spacing:.1em;fill:#6b7486;}.dg .dg-note{font-size:13px;fill:#6b7486;}.dg .dg-code{font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;font-size:12px;}.dg .dg-check{font-size:13.5px;fill:#2c3443;}.dg .dg-band-title{font-size:14.5px;font-weight:600;fill:#e8ebf1;}</style><marker id="governance-arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5f6a7f"/></marker><marker id="governance-arrow-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#98a1b1"/></marker><marker id="governance-arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#b195f7"/></marker><marker id="governance-arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#f2646f"/></marker><marker id="governance-arrow-lit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#7cb2ff"/></marker></defs>
<rect class="dg-bg" width="1448" height="420" rx="18"/>
<g class="dg-edge dg-edge-flow" data-from="request" data-to="preflight"><path class="dg-line" d="M228 134 L276 134" marker-end="url(#governance-arrow-flow)"/></g>
<g class="dg-edge dg-edge-flow" data-from="preflight" data-to="snapshot"><path class="dg-line" d="M464 134 L512 134" marker-end="url(#governance-arrow-flow)"/><text class="dg-edge-label" x="488" y="124" text-anchor="middle">YES</text></g>
<g class="dg-edge dg-edge-flow" data-from="snapshot" data-to="recheck"><path class="dg-line" d="M700 134 L748 134" marker-end="url(#governance-arrow-flow)"/></g>
<g class="dg-edge dg-edge-flow" data-from="recheck" data-to="run"><path class="dg-line" d="M936 134 L984 134" marker-end="url(#governance-arrow-flow)"/><text class="dg-edge-label" x="960" y="124" text-anchor="middle">MATCH</text></g>
<g class="dg-edge dg-edge-flow" data-from="run" data-to="verify"><path class="dg-line" d="M1172 134 L1220 134" marker-end="url(#governance-arrow-flow)"/></g>
<g class="dg-edge dg-edge-reject" data-from="preflight" data-to="deny"><path class="dg-line" d="M370 204 L370 290 Q370 300 380 300 L456 300" marker-end="url(#governance-arrow-reject)"/><text class="dg-edge-label" x="382" y="242">NO</text></g>
<g class="dg-edge dg-edge-reject" data-from="recheck" data-to="deny"><path class="dg-line" d="M842 204 L842 290 Q842 300 832 300 L756 300" marker-end="url(#governance-arrow-reject)"/><text class="dg-edge-label" x="854" y="242">MISMATCH</text></g>
<g class="dg-node dg-step" data-id="request" tabindex="0"><rect class="dg-box" x="40" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="58" y="97" fill="#98a1b1">01 DEFINE</text><text class="dg-title" x="58" y="122">Request + policy</text><text class="dg-detail" x="58" y="146">actor, task, model</text><text class="dg-detail" x="58" y="167">limits + registries</text><text class="dg-detail" x="58" y="188">allowed identities</text></g>
<g class="dg-node dg-gate" data-id="preflight" tabindex="0"><rect class="dg-box" x="276" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="294" y="97" fill="#465063">02 ADMIT</text><text class="dg-title" x="294" y="122">Preflight gate</text><text class="dg-detail" x="294" y="146">checks request, policy</text><text class="dg-detail" x="294" y="167">and registered</text><text class="dg-detail" x="294" y="188">identities</text></g>
<g class="dg-node dg-step" data-id="snapshot" tabindex="0"><rect class="dg-box" x="512" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="530" y="97" fill="#98a1b1">03 FREEZE</text><text class="dg-title" x="530" y="122">Private snapshot</text><text class="dg-detail" x="530" y="146">exact copy of the task</text><text class="dg-detail" x="530" y="167">tree, for this run only</text></g>
<g class="dg-node dg-gate" data-id="recheck" tabindex="0"><rect class="dg-box" x="748" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="766" y="97" fill="#465063">04 RECHECK</text><text class="dg-title" x="766" y="122">Identity recheck</text><text class="dg-detail" x="766" y="146">recomputes task, image,</text><text class="dg-detail" x="766" y="167">recipe and scanner</text><text class="dg-detail" x="766" y="188">identities</text></g>
<g class="dg-node dg-target" data-id="run" tabindex="0"><rect class="dg-box" x="984" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="1002" y="97" fill="#f5a35c">05 RUN</text><text class="dg-title" x="1002" y="122">Exact execution</text><text class="dg-detail" x="1002" y="146">approved image</text><text class="dg-detail" x="1002" y="167">+ approved recipe</text></g>
<g class="dg-node dg-output" data-id="verify" tabindex="0"><rect class="dg-box" x="1220" y="72" width="188" height="132" rx="10"/><text class="dg-tag" x="1238" y="97" fill="#3fcbd3">06 VERIFY</text><text class="dg-title" x="1238" y="122">Observed result</text><text class="dg-detail" x="1238" y="146">evidence + limits</text><text class="dg-detail" x="1238" y="167">→ final outcome</text></g>
<g class="dg-node dg-deny" data-id="deny" tabindex="0"><rect class="dg-box" x="456" y="268" width="300" height="64" rx="10"/><text class="dg-tag" x="474" y="293" fill="#f2646f">DENIED</text><text class="dg-title" x="474" y="318">Stop and record the denial</text></g>
<text class="dg-note" x="606" y="376" text-anchor="middle">Preflight denial happens before cluster setup, image work, credential loading or any model call.</text>
</svg>
