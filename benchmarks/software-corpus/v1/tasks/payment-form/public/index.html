<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment form</title></head><body><main><h1>Create a payment</h1><form id="payment"><label>Amount <input id="amount" inputmode="decimal" aria-describedby="error"></label><button>Submit payment</button></form><p id="error" role="alert"></p><output id="receipt" aria-live="polite"></output></main><script type="module">import {submitForm} from './client.mjs';document.querySelector('#payment').onsubmit=async event=>{event.preventDefault();const result=await submitForm(document.querySelector('#amount').value,async payload=>{const response=await fetch('/payments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});return response.json();});document.querySelector('#error').textContent=result.field_error||'';document.querySelector('#receipt').textContent=result.receipt?`Payment ${result.receipt.id}: $${(result.receipt.amount_minor/100).toFixed(2)}`:'';};</script></body></html>
